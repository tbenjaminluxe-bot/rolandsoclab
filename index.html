<!-- ===== ROXY AI BIG CHAT - FIXED ===== -->
<div style="background:#1e1b4b;padding:16px;border-radius:16px;margin:16px 0;border:2px solid #a855f7;">
  <h3 style="margin:0;">🤖 ROXY AI - Ask Me Anything!</h3>
  <p style="font-size:14px;">Try: What is IP? What is DDoS? How to use Intruder?</p>

  <div id="aiChat" style="background:#0f172a;padding:14px;border-radius:12px;height:280px;overflow:auto;font-size:16px;line-height:1.5;">
    🤖 <b>ROXY AI:</b> Hi Roland! 👋 Ask me anything below, I go answer you!
  </div>

  <input id="aiInput" placeholder="Type your question here..." style="width:100%;padding:16px;border-radius:12px;border:none;margin-top:12px;font-size:16px;background:white;color:black;">
  <button onclick="chatAI()" style="background:#a855f7;color:white;padding:16px;border-radius:12px;width:100%;margin-top:10px;font-size:18px;font-weight:bold;">Send ➡️ Ask ROXY AI</button>
  <button onclick="document.getElementById('aiChat').innerHTML='🤖 <b>ROXY AI:</b> Cleared! Ask me new question!'" style="background:#334155;color:white;padding:10px;border-radius:10px;width:100%;margin-top:8px;">Clear Chat 🧹</button>
</div>

<script>
function chatAI(){
  let inp = document.getElementById('aiInput');
  let q = inp.value.toLowerCase();
  if(!q) return;
  let box = document.getElementById('aiChat');
  let ans = "";
  if(q.includes('ip')) ans = "IP na your device house address. Example: 192.168.1.10. Without am, data no go sabi where to go!";
  else if(q.includes('ddos') || q.includes('attack')) ans = "DDoS na when plenty fake traffic jam server make real users no fit enter. Layer 3/4 block road, Layer 7 disturb one shop. Defend with firewall + Cloudflare. Never attack site wey no be yours!";
  else if(q.includes('wireshark')) ans = "Wireshark na CCTV for network. E dey show packets. Try filter: http or dns. Only for your own network!";
  else if(q.includes('windows') || q.includes('shortcut') || q.includes('lock') || q.includes('screenshot')) ans = "Best shortcuts: Windows+L = Lock, Windows+E = Files, Windows+Shift+S = Snip, Ctrl+Shift+T = Bring back closed tab, Alt+Tab = Switch apps!";
  else if(q.includes('intruder') || q.includes('payload')) ans = "Intruder na to try many payloads at once. If one Len different, that one na the interesting one! Copy am go Repeater!";
  else if(q.includes('repeater')) ans = "Repeater na to send one request again and again. Paste URL, tap GO!";
  else if(q.includes('decoder') || q.includes('base64')) ans = "Decoder na to change text to code and back. E.g hello -> aGVsbG8=";
  else if(q.includes('cv') || q.includes('career') || q.includes('job')) ans = "For CV write: Built ROXY v6.0 - Web security learning app. For interview practice: What is IP? What is DDoS? What is Wireshark?";
  else if(q.includes('hi') || q.includes('hello') || q.includes('hey')) ans = "Hey Roland! 👋 I dey here. Ask me about IP, DDoS, Wireshark, Windows, Intruder - anything!";
  else ans = "Good question! Try ask: 'What is IP?' or 'What is DDoS?' or 'How to use Intruder?' - I sabi all ROXY topics!";
  box.innerHTML += "<br><br>🧑 <b>You:</b> " + inp.value + "<br>🤖 <b>ROXY AI:</b> " + ans;
  box.scrollTop = box.scrollHeight;
  inp.value = "";
}
</script>
