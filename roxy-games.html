<!-- NEW - ONE PAGE - DELETE OLD FIRST -->
<div style="background:#0d2a6b; height:100dvh; display:flex; flex-direction:column; padding:8px; text-align:center; font-family:Arial; box-sizing:border-box; overflow:hidden; max-width:500px; margin:0 auto;">

<div style="flex-shrink:0;">
<h2 style="color:white; font-size:19px; margin:2px;">ROXY LUDO KING</h2>
<p style="color:white; font-size:15px; margin:2px;">🔴 YOU vs 🔵 COMPUTER</p>
<div style="display:flex; gap:8px; margin:6px 0;">
<div style="background:#ff0000; color:white; flex:1; padding:8px; border-radius:10px; font-size:15px; text-align:left;"><b>🔴 YOU</b><br><span id="youPos">Home 🏠</span></div>
<div style="background:#0066ff; color:white; flex:1; padding:8px; border-radius:10px; font-size:15px; text-align:left;"><b>🔵 COMPUTER</b><br><span id="compPos">Home 🏠</span></div>
</div>
<p id="turnShow" style="background:yellow; color:black; padding:8px; border-radius:10px; font-weight:bold; font-size:15px; margin:4px 0;">👉 YOUR TURN</p>
</div>

<div id="board2" style="flex:1; display:grid; grid-template-columns:repeat(10, 1fr); grid-template-rows:repeat(11, 1fr); gap:2px; background:white; padding:6px; border-radius:12px; min-height:0;"></div>

<div style="flex-shrink:0; padding-top:6px;">
<div style="display:flex; align-items:center; justify-content:center; gap:10px;">
<span id="dice2" style="font-size:42px;">🎲</span>
<span id="diceNum" style="font-size:22px; font-weight:bold; color:white;">Tap ROLL</span>
<span id="msg2" style="color:white; font-size:14px; flex:1; text-align:left;">First to 100 wins!</span>
</div>
<button onclick="playTurn()" style="background:#ffcc00; color:black; padding:13px; width:100%; border-radius:12px; font-weight:bold; font-size:18px; border:3px solid white; margin-top:6px;">🎲 ROLL DICE</button>
<p id="win2" style="color:yellow; font-size:18px; font-weight:bold; margin:4px;"></p>
</div>
</div>

<script>
let you = 0, comp = 0, myTurn = true;
function draw2(){
  let b = document.getElementById('board2');
  b.innerHTML = "";
  for(let i=0;i<=100;i++){
    let d = document.createElement('div');
    d.style.cssText = "background:#eee; border-radius:4px; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden;";
    if(i==0) { d.innerText="🏁"; d.style.background="#fff2cc"; }
    else if(i==you && i==comp && you!=0) { d.innerText="🔴🔵"; d.style.background="#ffcccc"; d.style.fontSize="10px"; }
    else if(i==you && you!=0) { d.innerText="🔴"; d.style.background="#ffcccc"; d.style.fontSize="16px"; }
    else if(i==comp && comp!=0) { d.innerText="🔵"; d.style.background="#cce5ff"; d.style.fontSize="16px"; }
    else if(i==100) { d.innerText="🏆"; d.style.background="gold"; }
    else { d.innerText=i; }
    b.appendChild(d);
  }
  document.getElementById('youPos').innerText = you==0 ? "Home 🏠" : "Pos: "+you+" / 100";
  document.getElementById('compPos').innerText = comp==0 ? "Home 🏠" : "Pos: "+comp+" / 100";
}
draw2();
function playTurn(){
  if(!myTurn) return;
  let dice = Math.floor(Math.random()*6)+1;
  document.getElementById('diceNum').innerText = "You: "+dice;
  you = you + dice; if(you>100) you=100;
  document.getElementById('msg2').innerText = "You go to "+you;
  draw2();
  if(you>=100){ document.getElementById('win2').innerText="🎉🏆 YOU WIN! 🏆🎉"; return; }
  myTurn=false;
  document.getElementById('turnShow').innerText="🤖 COMPUTER TURN...";
  document.getElementById('turnShow').style.background="#00aaff";
  document.getElementById('turnShow').style.color="white";
  setTimeout(()=>{
    let cdice = Math.floor(Math.random()*6)+1;
    comp = comp + cdice; if(comp>100) comp=100;
    document.getElementById('diceNum').innerText = "Comp: "+cdice;
    document.getElementById('msg2').innerText = "Comp go to "+comp;
    draw2();
    if(comp>=100){ document.getElementById('win2').innerText="🤖 COMPUTER WIN!"; return; }
    myTurn=true;
    document.getElementById('turnShow').innerText="👉 YOUR TURN";
    document.getElementById('turnShow').style.background="yellow";
    document.getElementById('turnShow').style.color="black";
  }, 1000);
}
</script>
