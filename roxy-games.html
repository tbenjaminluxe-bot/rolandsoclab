<!-- STEP 4: MAKE GAME BIG LIKE HOME -->
<style>
.big-game { background:#0d2a6b; padding:0; margin:0; min-height:100vh; }
.big-game h2 { font-size:28px; padding:15px 0 5px; }
.turn-big { background:yellow; color:black; padding:16px; border-radius:12px; font-weight:bold; font-size:20px; margin:12px; }
.players-big { display:flex; gap:12px; margin:12px; }
.players-big div { flex:1; padding:18px 10px; border-radius:15px; font-size:19px; }
.players-big b { font-size:22px; }
.board-big { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; background:white; padding:12px; margin:12px; border-radius:15px; }
.board-big div { padding:22px 0 !important; font-size:26px !important; border-radius:10px !important; }
.dice-big { font-size:80px !important; margin:15px !important; }
.btn-big { background:#ffcc00; padding:20px !important; width:94% !important; border-radius:15px !important; font-size:22px !important; border:4px solid #fff !important; margin:8px; }
.btn-restart { background:white; padding:14px; width:94%; border-radius:12px; margin:5px; font-size:17px; font-weight:bold; }
.msg-big { font-size:19px; padding:10px; }
</style>

<!-- Replace your game div with this BIG one -->
<div class="big-game">

<h2 style="color:white">ROXY LUDO KING - Classic</h2>
<p style="color:white; font-size:18px">🔴 YOU vs 🔵 COMPUTER</p>

<p id="turnShow" class="turn-big">👉 YOUR TURN - Tap ROLL!</p>

<div class="players-big">
<div style="background:#ff0000; color:white">
<b>🔴 YOU</b><br><span id="youPos">Home 🏠</span><br><span id="youScore">Score: 0</span>
</div>
<div style="background:#0066ff; color:white">
<b>🔵 COMPUTER</b><br><span id="compPos">Home 🏠</span><br><span id="compScore">Score: 0</span>
</div>
</div>

<div id="board2" class="board-big"></div>

<p id="dice2" class="dice-big">🎲</p>
<p id="msg2" class="msg-big" style="color:white">You start first!</p>

<button onclick="playTurn()" class="btn-big">🎲 ROLL DICE - YOUR TURN</button><br>
<button onclick="reset2()" class="btn-restart">🔄 Restart Game</button>

<p id="win2" style="color:yellow; font-size:26px; font-weight:bold; padding:15px"></p>
</div>
