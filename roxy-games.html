<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<title>ROXY LUDO KING</title>
<style>
* { box-sizing:border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; background:#0d2a6b; font-family:Arial; overflow:hidden; }
</style>
</head>
<body>

<!-- FULL SCREEN GAME - ONE PAGE - NO SCROLL -->
<div style="background:#0d2a6b; width:100vw; height:100dvh; display:flex; flex-direction:column; padding:10px; text-align:center;">

<!-- TOP -->
<div>
<h2 style="color:white; font-size:20px; margin:4px;">ROXY LUDO KING - Classic</h2>
<p style="color:white; font-size:16px; margin:2px;">🔴 YOU vs 🔵 COMPUTER</p>

<div style="display:flex; gap:8px; margin:8px 0;">
<div style="background:#ff0000; color:white; flex:1; padding:10px; border-radius:12px; font-size:16px; text-align:left;"><b>🔴 YOU</b><br><span id="youPos">Home 🏠</span><br><span id="youScore">Score: 0</span></div>
<div style="background:#0066ff; color:white; flex:1; padding:10px; border-radius:12px; font-size:16px; text-align:left;"><b>🔵 COMPUTER</b><br><span id="compPos">Home 🏠</span><br><span id="compScore">Score: 0</span></div>
</div>

<p id="turnShow" style="background:yellow; color:black; padding:11px; border-radius:10px; font-weight:bold; font-size:16px; margin:4px 0;">👉 YOUR TURN - Tap ROLL!</p>
</div>

<!-- BOARD - 1 TO 100 - FULL -->
<div id="board2" style="flex:1; display:grid; grid-template-columns:repeat(10, 1fr); grid-template-rows:repeat(11, 1fr); gap:3px; background:white; padding:8px; border-radius:12px; min-height:0;"></div>

<!-- BOTTOM -->
<div style="padding-top:8px;">
<div style="display:flex; align-items:center; justify-content:center; gap:10px;">
<span style="font-size:48px;">🎲</span>
<span id="diceNum" style="font-size:22px; font-weight:bold; color:white;">Tap ROLL</span>
<span id="msg2" style="color:white; font-size:15px; flex:1; text-align:left;">First to 100 wins!</span>
</div>
<button onclick="playTurn()" style="background:#ffcc00; color:black; padding:15px; width:100%; border-radius:12px; font-weight:bold; font-size:19px; border:3px solid white; margin-top:8px;">🎲 ROLL DICE</button>
<button onclick="reset2()" style="background:white; padding:11px; width:100%; border-radius:10px; margin-top:8px; font-weight:bold; font-size:15px;">🔄 Restart Game</button>
<p id="win2" style="color:yellow; font-size:20px; font-weight:bold; margin:4px;"></p>
</div>

</div>

<script>
let you = 0, comp = 0, myTurn = true;

function draw2(){
  let b = document.getElementById('board2');
  b.innerHTML = "";
  for(let i=0;i<=100;i++){
    let d = document.createElement('div');
    d.style.cssText = "background:#eee; border-radius:4px; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden;";
    if(i==0){ d.innerText="🏁"; d.style.background="#fff2cc"; }
    else if(i==you && i==comp && you!=0){ d.innerText="🔴🔵"; d.style.background="#ffcccc"; d.style.fontSize="10px"; }
    else if(i==you && you!=0){ d.innerText="🔴"; d.style.background="#ffcccc"; d.style.fontSize="16px"; }
    else if(i==comp && comp!=0){ d.innerText="🔵"; d.style.background="#cce5ff"; d.style.fontSize="16px"; }
    else if(i==100){ d.innerText="🏆"; d.style.background="gold"; }
    else { d.innerText=i; }
    b.appendChild(d);
  }
  document.getElementById('youPos').innerText = you==0 ? "Home 🏠" : "Pos: "+you+" / 100";
  document.getElementById('compPos').innerText = comp==0 ? "Home 🏠" : "Pos: "+comp+" / 100";
  document.getElementById('youScore').innerText = "Score: "+you;
  document.getElementById('compScore').innerText = "Score: "+comp;
}
draw2();

function playTurn(){
  if(!myTurn) return;
  let dice = Math.floor(Math.random()*6)+1;
  document.getElementById('diceNum').innerText = "You: "+dice;
  you = you + dice; if(you>100) you=100;
  document.getElementById('msg2').innerText = "You go to "+you;
  draw2();
  if(you>=100){ document.getElementById('win2').innerText="🎉🏆 YOU WIN! 🏆🎉"; return; }
  myTurn=false;
  document.getElementById('turnShow').innerText="🤖 COMPUTER TURN...";
  document.getElementById('turnShow').style.background="#00aaff";
  document.getElementById('turnShow').style.color="white";
  setTimeout(()=>{
    let cdice = Math.floor(Math.random()*6)+1;
    comp = comp + cdice; if(comp>100) comp=100;
    document.getElementById('diceNum').innerText = "Comp: "+cdice;
    document.getElementById('msg2').innerText = "Comp go to "+comp;
    draw2();
    if(comp>=100){ document.getElementById('win2').innerText="🤖 COMPUTER WIN!"; return; }
    myTurn=true;
    document.getElementById('turnShow').innerText="👉 YOUR TURN - Tap ROLL!";
    document.getElementById('turnShow').style.background="yellow";
    document.getElementById('turnShow').style.color="black";
  }, 1000);
}

function reset2(){
  you=0; comp=0; myTurn=true;
  document.getElementById('win2').innerText="";
  document.getElementById('msg2').innerText="First to 100 wins!";
  document.getElementById('diceNum').innerText="Tap ROLL";
  document.getElementById('turnShow').innerText="👉 YOUR TURN - Tap ROLL!";
  document.getElementById('turnShow').style.background="yellow";
  document.getElementById('turnShow').style.color="black";
  draw2();
}
</script>

</body>
</html>
