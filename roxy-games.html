<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROXY LUDO KING</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body { background:#1a4aa0; color:white; text-align:center; }
.topbar { background:#0d2a6b; display:flex; justify-content:space-between; padding:12px 15px; font-weight:bold; }
.topbar span { background:#ffb800; color:black; padding:4px 10px; border-radius:20px; }
.logo { padding:25px 0 5px; }
.logo h1 { font-size:52px; text-shadow:3px 3px 0 #000; }
.logo h1 .y { color:#ffcc00; } .logo h1 .r { color:#ff3333; } .logo h1 .g { color:#00cc44; } .logo h1 .b { color:#00aaff; }
.logo p { color:#ffcc00; font-size:20px; font-weight:bold; }
.dice-row { font-size:45px; margin:12px 0; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:15px; }
.card { background:#ffcc00; color:#000; border:3px solid #fff; border-radius:15px; padding:20px 5px; font-weight:bold; font-size:17px; }
.card small { display:block; font-weight:normal; font-size:13px; }
.tournament { background:#ffcc00; color:#000; margin:0 15px 15px; padding:16px; border-radius:15px; border:3px solid #fff; font-weight:bold; font-size:19px; }
.bottom { background:#0d2a6b; padding:12px; display:flex; justify-content:space-around; margin-top:10px; }
</style>
</head>
<body>

<div class="topbar"><span>👑 ROXY</span><span>🪙 00 💎 00</span></div>

<div class="logo">
<h1><span class="y">L</span><span class="r">U</span><span class="g">D</span><span class="b">O</span> <span class="y">K</span><span class="r">I</span><span class="g">N</span><span class="b">G</span></h1>
<p>★ ROXY EDITION ★<br>By Roland - CEO</p>
</div>

<div class="dice-row">🎲 🔴 🟡 🟢 🔵 🎲</div>

<div class="grid">
<div class="card">🌍<br>PLAY ONLINE<small>Play with world</small></div>
<div class="card">❤️<br>PLAY WITH FRIENDS<small>Play with friends</small></div>
<div class="card">🤖<br>VS COMPUTER<small>Play with computer</small></div>
<div class="card">👥<br>PASS N PLAY<small>Play offline</small></div>
</div>

<div class="tournament">🏆 TOURNAMENT</div>
<div class="bottom"><span>🏠 Home</span><span>🏆 Tournament</span><span>👤 Profile</span></div>

</body>
</html>
