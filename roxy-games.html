<!-- PERFECT SIZE - MAMA FIT SEE ALL GAME FOR ONE SCREEN -->
<div style="background:#0d2a6b; padding:10px; text-align:center; font-family:Arial; max-width:500px; margin:0 auto; box-sizing:border-box; overflow:hidden;">

<h2 style="color:white; font-size:22px; margin:5px;">ROXY LUDO KING - Classic</h2>
<p style="color:white; font-size:17px; margin:3px;">🔴 YOU vs 🔵 COMPUTER</p>

<p id="turnShow" style="background:yellow; color:black; padding:10px; border-radius:10px; font-weight:bold; font-size:17px; margin:8px 0;">👉 YOUR TURN - Tap ROLL!</p>

<div style="display:flex; gap:8px; margin:8px 0;">
<div style="background:#ff0000; color:white; flex:1; padding:10px; border-radius:12px; font-size:16px; text-align:left;"><b>🔴 YOU</b><br><span id="youPos">Home 🏠</span><br><span id="youScore">Score: 0</span></div>
<div style="background:#0066ff; color:white; flex:1; padding:10px; border-radius:12px; font-size:16px; text-align:left;"><b>🔵 COMPUTER</b><br><span id="compPos">Home 🏠</span><br><span id="compScore">Score: 0</span></div>
</div>

<!-- BOARD - 10 COLUMNS, MEDIUM SIZE, FIT SCREEN -->
<div id="board2" style="display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; background:white; padding:8px; border-radius:12px; width:100%; box-sizing:border-box;"></div>

<!-- DICE - FIXED, NO BREAK -->
<p id="dice2" style="font-size:50px; margin:8px 0 0; line-height:1;">🎲</p>
<p id="diceNum" style="font-size:28px; font-weight:bold; color:white; margin:0;">Tap ROLL</p>
<p id="msg2" style="color:white; font-size:16px; margin:5px;">You start first! First to 100 wins! 🏆</p>

<button onclick="playTurn()" style="background:#ffcc00; color:black; padding:15px; width:100%; border-radius:12px; font-weight:bold; font-size:19px; border:3px solid white; box-sizing:border-box;">🎲 ROLL DICE</button>
<button onclick="reset2()" style="background:white; padding:10px; width:100%; border-radius:10px; margin-top:8px; font-weight:bold; font-size:15px;">🔄 Restart Game</button>

<p id="win2" style="color:yellow; font-size:20px; font-weight:bold; padding:10px;"></p>
</div>

<script>
let you = 0, comp = 0, myTurn = true;
function draw2(){
  let b = document.getElementById('board2');
  b.innerHTML = "";
  for(let i=0;i<=100;i++){
    let d = document.createElement('div');
    // MEDIUM - Mama fit see, but e fit screen!
    d.style.cssText = "background:#eee; padding:8px 0; border-radius:5px; font-size:16px; font-weight:bold; text-align:center;";
    if(i==0) { d.innerText="🏁"; d.style.background="#fff2cc"; }
    else if(i==you && i==comp && you!=0) { d.innerText="🔴🔵"; d.style.background="#ffcccc"; d.style.fontSize="12px"; }
    else if(i==you && you!=0) { d.innerText="🔴"; d.style.background="#ffcccc"; }
    else if(i==comp && comp!=0) { d.innerText="🔵"; d.style.background="#cce5ff"; }
    else if(i==100) { d.innerText="🏆"; d.style.background="gold"; }
    else { d.innerText=i; }
    b.appendChild(d);
  }
  document.getElementById('youPos').innerText = you==0 ? "Home 🏠" : "Pos: "+you+" / 100";
  document.getElementById('compPos').innerText = comp==0 ? "Home 🏠" : "Pos: "+comp+" / 100";
  document.getElementById('youScore').innerText = "Score: "+you;
  document.getElementById('compScore').innerText = "Score: "+comp;
}
draw2();

function playTurn(){
  if(!myTurn) return;
  let dice = Math.floor(Math.random()*6)+1;
  document.getElementById('dice2').innerText = "🎲";
  document.getElementById('diceNum').innerText = "You: "+dice;
  you = you + dice; if(you>100) you=100;
  document.getElementById('msg2').innerText = "You roll "+dice+"! You go to "+you+" / 100";
  draw2();
  if(you>=100){ document.getElementById('win2').innerText="🎉🏆 YOU WIN! YOU ARE LUDO KING! 🏆🎉"; return; }
  myTurn=false;
  document.getElementById('turnShow').innerText="🤖 COMPUTER TURN... Wait...";
  document.getElementById('turnShow').style.background="#00aaff";
  document.getElementById('turnShow').style.color="white";
  setTimeout(()=>{
    let cdice = Math.floor(Math.random()*6)+1;
    comp = comp + cdice; if(comp>100) comp=100;
    document.getElementById('dice2').innerText = "🎲";
    document.getElementById('diceNum').innerText = "Computer: "+cdice;
    document.getElementById('msg2').innerText = "Computer roll "+cdice+"! Computer go to "+comp+" / 100";
    draw2();
    if(comp>=100){ document.getElementById('win2').innerText="🤖 COMPUTER WIN! Try Again!"; return; }
    myTurn=true;
    document.getElementById('turnShow').innerText="👉 YOUR TURN - Tap ROLL!";
    document.getElementById('turnShow').style.background="yellow";
    document.getElementById('turnShow').style.color="black";
  }, 1200);
}
function reset2(){
  you=0; comp=0; myTurn=true;
  document.getElementById('win2').innerText="";
  document.getElementById('msg2').innerText="New game! First to 100 wins!";
  document.getElementById('diceNum').innerText="Tap ROLL";
  document.getElementById('turnShow').innerText="👉 YOUR TURN - Tap ROLL!";
  document.getElementById('turnShow').style.background="yellow";
  document.getElementById('turnShow').style.color="black";
  draw2();
}
</script>
