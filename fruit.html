<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROXY FRUIT NINJA - 0.50</title>
<style>
* { box-sizing:border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; background:#0d2a6b; font-family:Arial; overflow:hidden; touch-action:none; }
#game { width:100vw; height:100dvh; display:flex; flex-direction:column; background:linear-gradient(#87CEEB, #FFF9C4); position:relative; overflow:hidden; }
.fruit { position:absolute; font-size:90px; user-select:none; pointer-events:none; line-height:1; text-shadow:0 4px 8px rgba(0,0,0,0.3); }
.half { position:absolute; font-size:65px; pointer-events:none; }
#knife { position:absolute; width:80px; height:80px; font-size:70px; pointer-events:none; z-index:99; display:none; transform:translate(-50%,-50%) rotate(45deg); }
.splash { position:absolute; font-size:40px; pointer-events:none; animation:pop 1.2s forwards; }
@keyframes pop { 0%{ transform:scale(0.5); opacity:1; } 100%{ transform:scale(1.5); opacity:0; } }
</style>
</head>
<body>
<div id="game">
<div style="padding:10px; text-align:center; background:#0d2a6b; flex-shrink:0; z-index:100;">
<h2 style="color:white; font-size:20px; margin:2px;">🍉 ROXY FRUIT NINJA 🔪</h2>
<p style="color:#ffcc00; font-size:14px; margin:0;">🐌 SPEED 0.50 - JUST RIGHT</p>
<div style="display:flex; gap:8px; margin:8px 0;">
<div style="background:white; flex:1; padding:8px; border-radius:12px; font-size:16px; font-weight:bold;">⭐ SCORE<br><span id="score" style="font-size:24px;">0</span></div>
<div style="background:#ffcc00; flex:1; padding:8px; border-radius:12px; font-size:16px; font-weight:bold;">⏰ TIME<br><span id="time" style="font-size:24px;">120</span></div>
<div style="background:#ff4444; color:white; flex:1; padding:8px; border-radius:12px; font-size:16px; font-weight:bold;">❤️ LIVES<br><span id="lives" style="font-size:24px;">10</span></div>
</div>
<p id="msg" style="color:yellow; font-size:15px; font-weight:bold; margin:3px;">Fruit go show quick, float slow!</p>
</div>
<div id="area" style="flex:1; position:relative; overflow:hidden;">
<canvas id="trail" style="position:absolute; inset:0; width:100%; height:100%;"></canvas>
<div id="knife">🔪</div>
<p style="text-align:center; color:#888; font-size:16px; margin-top:15px;">👆 Cut am!</p>
</div>
<div style="padding:10px; background:#0d2a6b; flex-shrink:0; text-align:center; z-index:100;">
<button onclick="startGame()" id="startBtn" style="background:#ffcc00; color:black; padding:15px; width:100%; border-radius:12px; font-weight:bold; font-size:20px; border:3px solid white;">▶️ START GAME</button>
<p id="win" style="color:yellow; font-size:20px; font-weight:bold; margin:6px;"></p>
</div>
</div>
<script>
let score=0, lives=10, timeLeft=120, playing=false, timer=null;
let fruits=["🍉","🍎","🍊","🍋","🍓","🍇","🍌","🍑","🍍","🥝","🍒"];
let SPEED = 0.50;
let area=document.getElementById('area');
let knife=document.getElementById('knife');
let canvas=document.getElementById('trail');
let ctx=canvas.getContext('2d');
let trail=[];
let activeFruits=[];
function resize(){ canvas.width=area.clientWidth; canvas.height=area.clientHeight; }
window.addEventListener('resize', resize); resize();
function startGame(){
  score=0; lives=10; timeLeft=120; playing=true;
  document.getElementById('score').innerText=score;
  document.getElementById('lives').innerText=lives;
  document.getElementById('time').innerText=timeLeft;
  document.getElementById('win').innerText="";
  document.getElementById('msg').innerText="GO! SPEED 0.50! 🔪🍉";
  document.getElementById('startBtn').innerText="🔥 PLAYING...";
  document.querySelectorAll('.fruit,.half,.splash').forEach(e=>e.remove());
  activeFruits=[];
  clearInterval(timer);
  timer=setInterval(()=>{ timeLeft--; document.getElementById('time').innerText=timeLeft; if(timeLeft<=0) endGame("⏰ TIME UP! Score: "+score+" 🎉"); },1000);
  spawnLoop();
}
function spawnLoop(){
  if(!playing) return;
  spawnFruit();
  setTimeout(spawnLoop, 2500);
}
function spawnFruit(){
  if(!playing) return;
  let isBomb = Math.random()<0.05;
  let el=document.createElement('div');
  el.innerText = isBomb ? "💣" : fruits[Math.floor(Math.random()*fruits.length)];
  el.className="fruit";
  let x = 20 + Math.random()*60;
  let y = 105;
  let vx = (Math.random()-0.5)*0.5;
  let vy = -(10 + Math.random()*2) * SPEED;
  el.style.left=x+"%";
  el.style.top=y+"%";
  area.appendChild(el);
  let f={el, x, y, vx, vy, isBomb, cut:false};
  activeFruits.push(f);
  function move(){
    if(f.cut) return;
    f.vy += 0.35 * SPEED;
    f.y += f.vy;
    f.x += f.vx;
    f.el.style.top=f.y+"%";
    f.el.style.left=f.x+"%";
    if(f.y>110){ f.el.remove(); activeFruits=activeFruits.filter(a=>a!==f); return; }
    requestAnimationFrame(move);
  }
  move();
}
function moveKnife(clientX, clientY){
  let r=area.getBoundingClientRect();
  let x=clientX-r.left, y=clientY-r.top;
  knife.style.display="block";
  knife.style.left=x+"px";
  knife.style.top=y+"px";
  trail.push({x,y});
  if(trail.length>12) trail.shift();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="white"; ctx.lineWidth=6; ctx.lineCap="round";
  ctx.beginPath();
  trail.forEach((p,i)=>{ if(i==0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  activeFruits.forEach(f=>{
    if(f.cut) return;
    let fr=f.el.getBoundingClientRect();
    let cx=fr.left+fr.width/2, cy=fr.top+fr.height/2;
    let dist=Math.hypot(clientX-cx, clientY-cy);
    if(dist<100) cutFruit(f, clientX, clientY);
  });
}
function cutFruit(f, cx, cy){
  f.cut=true;
  let r=area.getBoundingClientRect();
  let x=cx-r.left, y=cy-r.top;
  if(f.isBomb){
    lives--; document.getElementById('lives').innerText=lives;
    document.getElementById('msg').innerText="💥 BOOM! Lives: "+lives;
    let s=document.createElement('div'); s.className="splash"; s.innerText="💥💥"; s.style.left=(x-20)+"px"; s.style.top=(y-20)+"px"; area.appendChild(s); setTimeout(()=>s.remove(),1200);
    f.el.remove();
    if(lives<=0) endGame("💥 GAME OVER! Score: "+score);
    return;
  }
  score+=10; document.getElementById('score').innerText=score;
  document.getElementById('msg').innerText="Nice cut! +10! 🍉";
  let s=document.createElement('div'); s.className="splash"; s.innerText="💦🍉💦"; s.style.left=(x-30)+"px"; s.style.top=(y-20)+"px"; area.appendChild(s); setTimeout(()=>s.remove(),1200);
  let h1=document.createElement('div'); h1.className="half"; h1.innerText=f.el.innerText; h1.style.left=x+"px"; h1.style.top=y+"px"; area.appendChild(h1);
  let h2=document.createElement('div'); h2.className="half"; h2.innerText=f.el.innerText; h2.style.left=x+"px"; h2.style.top=y+"px"; area.appendChild(h2);
  let a1=-1, a2=1, hy=y;
  let fall=setInterval(()=>{ hy+=2; h1.style.left=(parseFloat(h1.style.left)+a1)+"px"; h2.style.left=(parseFloat(h2.style.left)+a2)+"px"; h1.style.top=hy+"px"; h2.style.top=hy+"px"; h1.style.opacity-=0.02; h2.style.opacity-=0.02; if(hy>r.height){ clearInterval(fall); h1.remove(); h2.remove(); } },30);
  f.el.remove();
  activeFruits=activeFruits.filter(a=>a!==f);
}
area.addEventListener('touchmove', e=>{ e.preventDefault(); let t=e.touches[0]; moveKnife(t.clientX, t.clientY); }, {passive:false});
area.addEventListener('touchstart', e=>{ let t=e.touches[0]; moveKnife(t.clientX, t.clientY); });
area.addEventListener('touchend', ()=>{ knife.style.display="none"; trail=[]; ctx.clearRect(0,0,canvas.width,canvas.height); });
area.addEventListener('mousemove', e=>{ if(e.buttons==1) moveKnife(e.clientX, e.clientY); });
function endGame(text){ playing=false; clearInterval(timer); document.getElementById('win').innerText=text; document.getElementById('startBtn').innerText="▶️ PLAY AGAIN"; document.getElementById('msg').innerText="Tap PLAY AGAIN!"; }
</script>
</body>
</html>
